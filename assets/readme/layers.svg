<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="layersTitle layersDesc">
  <title id="layersTitle">Where the work sits</title>
  <desc id="layersDesc">Four layers of work, from the bottom up. Foundations: data structures and SIMD, in C++ and Java, in the repos 30-data-structures-cpp and demo-vector-api-jdk25. Infrastructure: a Redis-backed queue with a Rust engine and Node and Python bindings, in chasquimq. Developer tools: small tools that remove daily friction, in Swift and TypeScript, in unport and prism. AI systems: retrieval that can be traced and metered, in Python and JavaScript, in pdse and qail.</desc>

  <rect width="1200" height="450" rx="24" fill="#0a0e13"/>
  <rect x="1" y="1" width="1198" height="448" rx="23" fill="none" stroke="#1e262f" stroke-width="1.5"/>

  <text x="40" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2.4" fill="#6e7a86">WHERE THE WORK SITS</text>
  <line x1="0" y1="70" x2="1200" y2="70" stroke="#1e262f" stroke-width="1.5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

    <!-- 04 AI systems -->
    <g transform="translate(0 70)">
      <line x1="40" y1="44" x2="64" y2="44" stroke="#3fb950" stroke-width="2.5"/>
      <text x="88" y="38" font-size="26" font-weight="700" fill="#e6edf3">AI systems</text>
      <text x="88" y="68" font-size="20" fill="#9aa5b1">Retrieval that can be traced, metered, and paid for</text>
      <text x="1160" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e" text-anchor="end">pdse · qail</text>
      <text x="1160" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#6e7a86" text-anchor="end">Python · JavaScript</text>
    </g>
    <line x1="40" y1="158" x2="1160" y2="158" stroke="#1e262f" stroke-width="1.5"/>

    <!-- 03 Developer tools -->
    <g transform="translate(0 158)">
      <line x1="40" y1="44" x2="64" y2="44" stroke="#3fb950" stroke-width="2.5"/>
      <text x="88" y="38" font-size="26" font-weight="700" fill="#e6edf3">Developer tools</text>
      <text x="88" y="68" font-size="20" fill="#9aa5b1">Small tools that take the friction out of a working machine</text>
      <text x="1160" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e" text-anchor="end">unport · prism</text>
      <text x="1160" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#6e7a86" text-anchor="end">TypeScript · Swift</text>
    </g>
    <line x1="40" y1="246" x2="1160" y2="246" stroke="#1e262f" stroke-width="1.5"/>

    <!-- 02 Infrastructure -->
    <g transform="translate(0 246)">
      <line x1="40" y1="44" x2="64" y2="44" stroke="#3fb950" stroke-width="2.5"/>
      <text x="88" y="38" font-size="26" font-weight="700" fill="#e6edf3">Infrastructure</text>
      <text x="88" y="68" font-size="20" fill="#9aa5b1">The queue underneath: Rust engine, Node and Python bindings</text>
      <text x="1160" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e" text-anchor="end">chasquimq</text>
      <text x="1160" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#6e7a86" text-anchor="end">Rust</text>
    </g>
    <line x1="40" y1="334" x2="1160" y2="334" stroke="#1e262f" stroke-width="1.5"/>

    <!-- 01 Foundations -->
    <g transform="translate(0 334)">
      <line x1="40" y1="44" x2="64" y2="44" stroke="#3fb950" stroke-width="2.5"/>
      <text x="88" y="38" font-size="26" font-weight="700" fill="#e6edf3">Foundations</text>
      <text x="88" y="68" font-size="20" fill="#9aa5b1">Data structures and SIMD, kept sharp on purpose</text>
      <text x="1160" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e" text-anchor="end">30-data-structures-cpp · demo-vector-api-jdk25</text>
      <text x="1160" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#6e7a86" text-anchor="end">C++ · Java</text>
